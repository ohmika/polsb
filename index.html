<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><title>Hartslagmeter PWA</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center;padding:20px}button{padding:12px 22px}#bpm{font-size:56px;color:#4caf50;margin:20px}</style></head><body><h2>Hartslagmeter</h2><p>Bedek de achtercamera met je vingertop.</p><div id="bpm">--</div><button onclick="start()">Start</button><video id="video" autoplay playsinline style="display:none"></video><canvas id="canvas" style="display:none"></canvas><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}let values=[],peaks=[];async function start(){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=s;const t=s.getVideoTracks()[0];try{await t.applyConstraints({advanced:[{torch:true}]})}catch(e){}setInterval(()=>{if(!video.videoWidth)return;canvas.width=50;canvas.height=50;const c=canvas.getContext('2d');c.drawImage(video,0,0,50,50);let d=c.getImageData(0,0,50,50).data,r=0;for(let i=0;i<d.length;i+=4)r+=d[i];r/=d.length/4;let n=Date.now();values.push({t:n,v:r});if(values.length>300)values.shift();if(values.length>5){let a=values.at(-3).v,b=values.at(-2).v,cv=values.at(-1).v;if(b>a&&b>cv)peaks.push(values.at(-2).t)}peaks=peaks.filter(p=>n-p<10000);if(peaks.length>2){let dur=(peaks.at(-1)-peaks[0])/1000;let bpm=((peaks.length-1)/dur)*60;if(bpm>40&&bpm<200)document.getElementById('bpm').textContent=Math.round(bpm)}},50)}</script></body></html>
